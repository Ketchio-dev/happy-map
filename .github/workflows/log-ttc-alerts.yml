name: Log TTC accessibility alerts

# Records elevator and escalator outages so the evidence page can report how often,
# where, and for how long step-free access is unavailable.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ttc-logger
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fetch and record
        run: node tools/log-once.mjs
      - name: Commit when the outage set changed
        run: |
          if [ -z "$(git status --porcelain data/ttc-alerts)" ]; then
            echo "nothing to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ttc-alerts
          git commit -m "data: TTC accessibility alerts $(date -u +'%Y-%m-%dT%H:%MZ') [skip ci]"
          git pull --rebase --autostash origin main
          git push
