name: Log TTC accessibility alerts

# Manual fallback for the outage logger. The five-minute timer on the VPS
# (tools/vps/) is the writer of record; GitHub delayed this schedule to roughly
# once every two hours, and two writers on one append-only log only ever
# produced rebase conflicts, so this runs on demand only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ttc-logger
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # the logger has no dependencies; skip the pnpm lookup that setup-node
          # does by default when package.json declares a packageManager
          package-manager-cache: false
      - name: Fetch and record
        run: node tools/log-once.mjs
      - name: Commit when the outage set changed
        run: |
          if [ -z "$(git status --porcelain data/ttc-alerts/*.jsonl)" ]; then
            echo "nothing to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ttc-alerts/*.jsonl
          git commit -m "data: TTC accessibility alerts $(date -u +'%Y-%m-%dT%H:%MZ') [skip ci]"
          git pull --rebase --autostash origin main
          git push
