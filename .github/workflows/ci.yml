name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/ttc-alerts/**"
      - "research/outages-summary.json"
      - "video/**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # loads the packed graph from the repo: invariants the router depends on, checked against real data
      - run: pnpm test
